name: GSIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run canonical and deterministic integration tests
        run: pytest -q tests/test_canonical_trading_path.py tests/test_canonical_notification_bus.py tests/test_end_to_end_wiring.py
      - name: Run static GSIS certification
        run: python gsis_certification.py
